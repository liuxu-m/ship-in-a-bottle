<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>瓶中沧海 · A Sea in a Bottle</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0907;color:#ead9bf;
            overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
       -webkit-font-smoothing:antialiased;user-select:none}
  canvas{display:block;touch-action:none}
  #stage{position:fixed;inset:0;cursor:grab}
  #stage.drag{cursor:grabbing}
  #vig{position:fixed;inset:0;pointer-events:none;
       background:radial-gradient(ellipse 78% 68% at 50% 46%,rgba(0,0,0,0) 42%,rgba(0,0,0,.34) 74%,rgba(0,0,0,.72) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;background:#e6eeff;opacity:0;mix-blend-mode:screen;transition:none}
  #hud{position:fixed;left:26px;top:24px;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.65)}
  #hud h1{margin:0;font-size:23px;letter-spacing:.34em;font-weight:600;color:#f2dcb4}
  #hud .sub{margin:6px 0 0;font-size:10.5px;letter-spacing:.42em;color:#b39a76;text-transform:uppercase}
  #panel{position:fixed;right:24px;top:24px;pointer-events:none;text-align:right;text-shadow:0 2px 10px rgba(0,0,0,.65)}
  #phase{font-size:26px;letter-spacing:.16em;color:#f2dcb4;font-weight:600}
  #clock{font-size:11px;letter-spacing:.28em;color:#a89173;margin-top:4px;font-variant-numeric:tabular-nums}
  #speeds{margin-top:12px;display:flex;gap:6px;justify-content:flex-end;pointer-events:auto}
  .sp{font-size:11px;letter-spacing:.08em;padding:5px 9px;border:1px solid rgba(226,196,146,.28);
      border-radius:2px;color:#c9b18d;background:rgba(20,14,9,.4);cursor:pointer;transition:.18s}
  .sp:hover{border-color:rgba(226,196,146,.6);color:#f4e2bd}
  .sp.on{background:rgba(226,196,146,.9);color:#1a1208;border-color:transparent;font-weight:700}
  #stormwrap{margin-top:14px;display:flex;align-items:center;gap:8px;justify-content:flex-end;pointer-events:auto}
  #stormwrap span{font-size:10px;letter-spacing:.3em;color:#8f7b60}
  #stormbtn{padding:5px 10px;letter-spacing:.14em}
  #viewwrap{margin-top:8px;display:flex;justify-content:flex-end;pointer-events:auto}
  #viewbtn{padding:5px 10px;letter-spacing:.14em}
  #stormbar{width:104px;height:3px;background:rgba(226,196,146,.16);border-radius:2px;overflow:hidden}
  #stormfill{height:100%;width:0;background:linear-gradient(90deg,#6fa8c8,#cfe6f2);transition:width .08s linear}
  #fps{margin-top:9px;font-size:10px;letter-spacing:.24em;color:#7d6a52;font-variant-numeric:tabular-nums}
  #keys{position:fixed;left:26px;bottom:22px;font-size:11px;line-height:2.05;color:#9c8567;
        letter-spacing:.1em;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.8)}
  #keys b{display:inline-block;min-width:56px;color:#e2c492;font-weight:600;letter-spacing:.06em}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;
        background:#0b0907;color:#c9b18d;font-size:13px;letter-spacing:.3em;z-index:9}
  #boot .bar{width:170px;height:2px;background:rgba(226,196,146,.18);overflow:hidden}
  #boot .bar i{display:block;width:40%;height:100%;background:#e2c492;animation:sweep 1.1s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  #mtouch{position:fixed;left:0;right:0;bottom:14px;display:none;justify-content:center;gap:8px;
          pointer-events:none;font-size:10.5px;letter-spacing:.12em}
  #mtouch span{padding:7px 11px;border:1px solid rgba(226,196,146,.3);border-radius:999px;
               background:rgba(18,12,7,.55);color:#dcc79c;white-space:nowrap}
  @media (max-width:860px),(pointer:coarse){
    #keys{display:none}
    #mtouch{display:flex}
    #hud{left:16px;top:16px}
    #hud h1{font-size:17px;letter-spacing:.24em}
    #hud .sub{font-size:9px;letter-spacing:.3em}
    #panel{right:14px;top:14px}
    #phase{font-size:19px}
    #clock{font-size:10px}
    .sp{padding:8px 11px;font-size:12px}
    #stormbar{width:74px}
  }
  @media (max-width:420px){ #hud .sub{display:none} }
  @media (max-height:520px) and (orientation:landscape){
    #hud .sub{display:none}
    #hud h1{font-size:15px;letter-spacing:.18em}
    #panel{top:10px;right:12px}
    #phase{font-size:15px}
    #clock{font-size:9px;margin-top:2px}
    #speeds{margin-top:7px;gap:5px}
    .sp{padding:6px 9px;font-size:11px}
    #stormwrap{margin-top:7px;gap:6px}
    #fps{display:none}
    #mtouch{bottom:6px;font-size:9.5px;gap:6px}
    #mtouch span{padding:4px 8px}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="vig"></div>
<div id="flash"></div>

<div id="hud">
  <h1>瓶中沧海</h1>
  <p class="sub">A Sea in a Bottle &nbsp;·&nbsp; voxel diorama</p>
</div>

<div id="panel">
  <div id="phase">黄昏</div>
  <div id="clock">18:00 &nbsp;/&nbsp; ×1</div>
  <div id="speeds">
    <div class="sp" data-s="1">×1</div>
    <div class="sp" data-s="4">×4</div>
    <div class="sp" data-s="12">×12</div>
    <div class="sp" data-s="0">暂停</div>
  </div>
  <div id="stormwrap"><span>STORM</span><div id="stormbar"><div id="stormfill"></div></div>
    <div class="sp" id="stormbtn" title="按 Space">起风</div></div>
  <div id="viewwrap"><div class="sp" id="viewbtn" title="全景 / 内景">内景</div></div>
  <div id="fps">— FPS</div>
</div>

<div id="keys">
  <div><b>拖动 / ← →</b>环视瓶身（静置自动旋转）</div>
  <div><b>滚轮 / + −</b>推近 / 拉远</div>
  <div><b>SPACE</b>按住掀起风暴（<b>F</b> 锁定）</div>
  <div><b>1 / 2 / 3</b>延时 ×1 / ×4 / ×12</div>
  <div><b>0 或 P</b>暂停时间</div>
</div>

<div id="mtouch"><span>单指拖动 · 环视</span><span>双指捏合 · 远近</span><span>双击 · 复位</span><span>点「起风」· 掀起风浪</span></div>

<div id="boot"><div>载入 THREE.JS r160</div><div class="bar"><i></i></div></div>

<script type="module">
/* ============================================================================
   瓶中沧海 · A Sea in a Bottle
   Three.js r160 · WebGL2 · InstancedMesh 体素批渲染 · 自定义 GLSL
   ========================================================================== */

/* ---------- 0. CDN 载入（多源容错 + 超时熔断） ---------- */
const CDNS = [
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js',
  'https://fastly.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://unpkg.com/three@0.160.0/build/three.module.js',
  'https://registry.npmmirror.com/three/0.160.0/files/build/three.module.js'
];
const bootEl = document.getElementById('boot');
const bootMsg = bootEl.firstElementChild;
function withTimeout(p, ms, tag) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout ' + tag)), ms))]);
}
let THREE = null;
for (let i = 0; i < CDNS.length && !THREE; i++) {
  const u = CDNS[i];
  bootMsg.textContent = '载入 THREE.JS r160  ' + (i + 1) + '/' + CDNS.length;
  try { THREE = await withTimeout(import(/* @vite-ignore */ u), 9000, u.slice(8, 34)); }
  catch (e) { console.warn('[cdn]', u, e && e.message); }
}
if (!THREE) {
  bootEl.innerHTML = '<div style="letter-spacing:.1em;text-align:center;line-height:2">无法从 CDN 载入 Three.js r160<br>' +
    '<small style="opacity:.6">请检查网络后点击重试（可换用国内镜像）</small><br>' +
    '<button id="retry" style="margin-top:18px;padding:8px 22px;background:transparent;color:#e2c492;' +
    'border:1px solid rgba(226,196,146,.5);border-radius:2px;letter-spacing:.2em;cursor:pointer;font-size:12px">重 试</button></div>';
  document.getElementById('retry').onclick = () => location.reload();
  throw new Error('three load failed');
}
bootEl.remove();

/* ---------- 1. 工具 ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const smooth= (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const damp  = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));
let _seed = 20240607;
const srnd = () => { _seed = (_seed * 1664525 + 1013904223) & 0x7fffffff; return _seed / 0x7fffffff; };
const sr   = (a, b) => a + srnd() * (b - a);
const _ccache = new Map();
function col(hex) { let c = _ccache.get(hex); if (!c) { c = new THREE.Color(hex); _ccache.set(hex, c); } return c; }
const dummy = new THREE.Object3D();

/* ============================================================================
   2. 全局尺度 —— 瓶体沿 X 轴横卧
   ========================================================================== */
const BOT_Y   = 6.10;            // 瓶轴离桌面高度
const AX0     = -7.20;           // 瓶底轴向坐标（使瓶腹中心与瓶内世界原点重合）
const LEN     = 25.6;            // 瓶全长
const WATER_Y = -0.55;           // 瓶内水平面（相对瓶轴）
const WAVE_A  = 0.215;           // 常浪高
const WAVE_AS = 0.345;           // 风暴浪高
const CELL    = (typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches) ? 0.31 : 0.26;  // 体素水面栅格

// 剖面：u=0 为瓶底，u=1 为瓶口。腹 → 肩 → 细颈 → 厚唇
const PROFILE = [
  [0, 0], [.0117, 1.9], [.0313, 2.9], [.0625, 3.8], [.1016, 4.5], [.1602, 4.85],
  [.2383, 5.0], [.336, 5.0], [.434, 4.85], [.492, 4.5], [.539, 4.0], [.586, 3.3],
  [.625, 2.5], [.660, 1.8], [.688, 1.35], [.711, 1.15], [.734, 1.08], [.805, 1.06],
  [.883, 1.06], [.930, 1.12], [.957, 1.42], [.977, 1.5], [.992, 1.32], [1, 1.2]
];
function outerR(u) {
  u = clamp(u, 0, 1);
  for (let i = 0; i < PROFILE.length - 1; i++) {
    const a = PROFILE[i], b = PROFILE[i + 1];
    if (u <= b[0]) { const t = (u - a[0]) / (b[0] - a[0]); return lerp(a[1], b[1], t); }
  }
  return PROFILE[PROFILE.length - 1][1];
}
const innerR = ax => Math.max(0, outerR((ax - AX0) / LEN) * 0.955 - 0.035);

/* ---------- 浪高：GLSL 与 JS 完全同构 ---------- */
function waveH(x, z, t, a) {
  return ( Math.sin(x * 1.05 + t * 1.30) * 0.62
         + Math.sin(z * 1.33 - t * 1.10 + 1.7) * 0.48
         + Math.sin((x * 0.72 + z * 0.94) + t * 1.85) * 0.33
         + Math.sin((x * 2.05 - z * 1.65) - t * 2.55 + 0.6) * 0.14
         + Math.sin((x * 0.35 + z * 0.28) - t * 0.75) * 0.22 ) * a;
}

/* ============================================================================
   3. 渲染器 / 场景 / 相机
   ========================================================================== */
const COARSE = (matchMedia('(pointer: coarse)').matches || Math.min(innerWidth, innerHeight) < 700);

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: !COARSE, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x140f0a, 0.0062);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.08, 420);

const RT_SCALE = COARSE ? 0.5 : 0.7;
const rt = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
const glassU = { uRes: { value: new THREE.Vector2(1, 1) } };

// 按总像素预算反推 devicePixelRatio：手机高 DPR 下填充率不失控
const PIXEL_BUDGET = COARSE ? 1.25e6 : 3.6e6;
function pixelRatio() {
  const n = innerWidth * innerHeight;
  return Math.max(1, Math.min(devicePixelRatio || 1, 2, Math.sqrt(PIXEL_BUDGET / n)));
}
function onResize() {
  const w = innerWidth, h = innerHeight;
  const pr = pixelRatio();
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  rt.setSize(Math.max(2, Math.floor(w * pr * RT_SCALE)), Math.max(2, Math.floor(h * pr * RT_SCALE)));
  glassU.uRes.value.set(w * pr, h * pr);
  fitCamera(true);
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 220));

/* ============================================================================
   4. 程序化贴图
   ========================================================================== */
function cvs(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function tex(c, rx = 1, ry = 1) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
function woodTex(base, dark, planks) {
  const c = cvs(1024, 1024), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 2600; i++) {                       // 木纹
    const y = srnd() * 1024, len = 80 + srnd() * 620, x = srnd() * 1100 - 40;
    g.strokeStyle = 'rgba(0,0,0,' + (0.015 + srnd() * 0.055).toFixed(3) + ')';
    g.lineWidth = 0.5 + srnd() * 2.4;
    g.beginPath(); g.moveTo(x, y);
    g.bezierCurveTo(x + len * .3, y + sr(-6, 6), x + len * .7, y + sr(-6, 6), x + len, y + sr(-4, 4));
    g.stroke();
  }
  for (let i = 0; i < 90; i++) {                          // 木节
    const x = srnd() * 1024, y = srnd() * 1024, r = 4 + srnd() * 13;
    const rg = g.createRadialGradient(x, y, 1, x, y, r);
    rg.addColorStop(0, 'rgba(0,0,0,.30)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.beginPath(); g.ellipse(x, y, r * 1.9, r, 0, 0, TAU); g.fill();
  }
  g.fillStyle = dark;                                    // 板缝
  for (let i = 1; i < planks; i++) { const y = i * 1024 / planks; g.fillRect(0, y - 1.5, 1024, 3); }
  for (let i = 0; i < 700; i++) {                        // 磨损亮点
    g.fillStyle = 'rgba(255,225,180,' + (srnd() * 0.05).toFixed(3) + ')';
    g.fillRect(srnd() * 1024, srnd() * 1024, srnd() * 40, srnd() * 2);
  }
  return tex(c);
}
function corkTex() {
  const c = cvs(256, 256), g = c.getContext('2d');
  g.fillStyle = '#c9a06a'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = 'rgba(' + (90 + srnd() * 90 | 0) + ',' + (60 + srnd() * 60 | 0) + ',' + (30 + srnd() * 40 | 0) + ',' + (0.15 + srnd() * .5).toFixed(2) + ')';
    const w = 2 + srnd() * 9, h = 1 + srnd() * 4;
    g.save(); g.translate(srnd() * 256, srnd() * 256); g.rotate(srnd() * TAU);
    g.beginPath(); g.ellipse(0, 0, w, h, 0, 0, TAU); g.fill(); g.restore();
  }
  return tex(c, 2, 1);
}
function bookTex(t1, t2, ink) {
  const c = cvs(256, 256), g = c.getContext('2d');
  g.fillStyle = t1; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 900; i++) { g.fillStyle = 'rgba(0,0,0,' + (srnd() * .1).toFixed(2) + ')'; g.fillRect(srnd() * 256, srnd() * 256, srnd() * 20, srnd() * 2); }
  g.strokeStyle = ink; g.lineWidth = 3; g.strokeRect(15, 15, 226, 226);
  g.lineWidth = 1.2; g.strokeRect(24, 24, 208, 208);
  g.save(); g.translate(128, 150); g.fillStyle = ink;
  g.font = 'bold 25px Georgia,serif'; g.textAlign = 'center';
  g.fillText(t1, 0, 0); g.font = '15px Georgia,serif'; g.fillText(t2, 0, 30); g.restore();
  g.save(); g.translate(128, 128); g.strokeStyle = ink; g.lineWidth = 2;
  g.beginPath(); g.moveTo(-26, -34); g.lineTo(0, -6); g.lineTo(26, -34); g.stroke();
  g.beginPath(); g.moveTo(0, -6); g.lineTo(0, 40); g.stroke();
  g.beginPath(); g.moveTo(-18, 6); g.quadraticCurveTo(0, 22, 18, 6); g.stroke(); g.restore();
  return tex(c);
}
function tagTex() {
  const c = cvs(256, 320), g = c.getContext('2d');
  g.fillStyle = '#e3d3b2'; g.fillRect(0, 0, 256, 320);
  for (let i = 0; i < 1400; i++) { g.fillStyle = 'rgba(120,95,60,' + (srnd() * .12).toFixed(2) + ')'; g.fillRect(srnd() * 256, srnd() * 320, srnd() * 8, 1); }
  g.strokeStyle = '#7d5f3a'; g.lineWidth = 4; g.strokeRect(16, 16, 224, 288);
  g.strokeStyle = '#a06a2c'; g.lineWidth = 5; g.lineCap = 'round';
  g.beginPath(); g.moveTo(56, 150); g.quadraticCurveTo(128, 176, 200, 150); g.stroke();  // 船体
  g.beginPath(); g.moveTo(128, 150); g.lineTo(128, 62); g.stroke();
  g.beginPath(); g.moveTo(80, 96); g.lineTo(128, 96); g.lineTo(128, 68); g.lineTo(80, 68); g.closePath(); g.stroke();
  g.beginPath(); g.moveTo(136, 100); g.lineTo(176, 100); g.lineTo(176, 74); g.lineTo(136, 74); g.closePath(); g.stroke();
  g.fillStyle = '#7d5f3a'; g.font = 'bold 40px Georgia,serif'; g.textAlign = 'center';
  g.fillText('VII', 128, 226); g.font = '19px Georgia,serif'; g.fillText('MARE  IN  VINO', 128, 258);
  return tex(c);
}
function shadowTex() {
  const c = cvs(256, 256), g = c.getContext('2d');
  const rg = g.createRadialGradient(128, 128, 8, 128, 128, 124);
  rg.addColorStop(0, 'rgba(0,0,0,.80)'); rg.addColorStop(.45, 'rgba(0,0,0,.42)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 256, 256);
  return tex(c);
}

/* ============================================================================
   5. 体素批渲染工具
   ========================================================================== */
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
function voxelMesh(list, mat) {
  const m = new THREE.InstancedMesh(boxGeo, mat, list.length);
  for (let i = 0; i < list.length; i++) {
    const v = list[i];
    dummy.position.set(v.x, v.y, v.z);
    dummy.rotation.set(v.rx || 0, v.ry || 0, v.rz || 0);
    dummy.scale.set(v.sx, v.sy, v.sz);
    dummy.updateMatrix();
    m.setMatrixAt(i, dummy.matrix);
    m.setColorAt(i, col(v.c));
  }
  m.instanceMatrix.needsUpdate = true;
  if (m.instanceColor) m.instanceColor.needsUpdate = true;
  m.frustumCulled = false;
  return m;
}
const V = (list, x, y, z, s, c) => list.push({ x, y, z, sx: s, sy: s, sz: s, c });

/* ============================================================================
   6. 材质
   ========================================================================== */
const woodTableTex = woodTex('#4a3320', '#241608', 6);
const woodCradleTex = woodTex('#6b4526', '#2e1c0c', 1);
const matTable   = new THREE.MeshStandardMaterial({ map: woodTableTex, roughness: .78, metalness: .04 });
const matCradle  = new THREE.MeshStandardMaterial({ map: woodCradleTex, roughness: .72, metalness: .04 });
const matBrass   = new THREE.MeshStandardMaterial({ color: 0xc8a052, roughness: .32, metalness: .85, emissive: 0x2a1c07 });
const matBrassD  = new THREE.MeshStandardMaterial({ color: 0x8a6b33, roughness: .45, metalness: .8, emissive: 0x1a1104 });
const matPaper   = new THREE.MeshStandardMaterial({ color: 0xe8dcc0, roughness: .95 });
const matBackdrop= new THREE.MeshBasicMaterial({ side: THREE.BackSide, depthWrite: false });

/* 瓶内体素（受昼夜染色） */
const matVox   = new THREE.MeshLambertMaterial({ color: 0xffffff });
const matVox2  = new THREE.MeshLambertMaterial({ color: 0xffffff });
const matCloud = new THREE.MeshBasicMaterial({ color: 0xffffff });
const matGull  = new THREE.MeshLambertMaterial({ color: 0xf3f0e6 });
const matEmis  = new THREE.MeshStandardMaterial({ color: 0x2a1c08, emissive: 0xffb347, emissiveIntensity: 0.0, roughness: .4, metalness: .3 });

function latheGeo(scaleR, k) {
  const pts = [];
  for (let i = 0; i <= 96; i++) {
    const u = i / 96;
    let r = outerR(u) * scaleR;
    r += Math.sin(u * 27.3) * .035 + Math.sin(u * 61.7) * .018;   // 手吹微瑕
    pts.push(new THREE.Vector2(Math.max(.001, r), AX0 + u * LEN * k));
  }
  const g = new THREE.LatheGeometry(pts, 72);
  g.rotateZ(-Math.PI / 2);
  return g;
}
const glassMat = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: rt.texture }, uRes: glassU.uRes,
    uRim:   { value: new THREE.Color(0x9fe4ff) },
    uTint:  { value: new THREE.Color(0x8fd7c4) },
    uNight: { value: 0.0 }, uWarm: { value: 0.0 }
  },
  vertexShader: /* glsl */`
    varying vec3 vW; varying vec3 vN;
    void main(){
      vW = (modelMatrix * vec4(position,1.0)).xyz;
      vN = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * vec4(vW,1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tScene; uniform vec2 uRes;
    uniform vec3 uRim, uTint; uniform float uNight, uWarm;
    varying vec3 vW; varying vec3 vN;
    void main(){
      vec3 N = normalize(vN);
      vec3 V = normalize(cameraPosition - vW);
      if(dot(N,V) < 0.0) N = -N;
      float ndv = max(dot(N,V), 0.0);
      float fres = pow(1.0 - ndv, 4.2);

      // 折射（低分辨率场景缓冲 + 色散）
      vec2 uv = gl_FragCoord.xy / uRes;
      float k = 0.055 / max(ndv, 0.28);
      vec3 refr;
      refr.r = texture2D(tScene, uv + N.xy * k * 1.06).r;
      refr.g = texture2D(tScene, uv + N.xy * k).g;
      refr.b = texture2D(tScene, uv + N.xy * k * 0.94).b;

      // 室内环境反射
      vec3 R = reflect(-V, N);
      vec3 env = mix(vec3(0.045,0.040,0.036), vec3(0.52,0.40,0.27), smoothstep(-0.55, 0.85, R.y));
      env += vec3(0.30,0.17,0.06) * pow(max(dot(R, normalize(vec3(-0.55,0.62,0.55))),0.0), 5.0);

      // 高光
      vec3 L1 = normalize(vec3(-0.55, 0.80, 0.42));
      vec3 L2 = normalize(vec3( 0.70, 0.35,-0.62));
      float s1 = pow(max(dot(R, L1), 0.0), 240.0);
      float s2 = pow(max(dot(R, L2), 0.0), 46.0);
      float s3 = pow(max(dot(R, L1), 0.0), 14.0);

      vec3 col = mix(refr, refr * uTint, 0.30);
      col += env * (0.055 + 0.24 * fres);
      col += vec3(1.0,0.95,0.86) * s1 * 1.7;
      col += vec3(0.72,0.86,1.0) * s2 * 0.30;
      col += vec3(0.45,0.30,0.15) * s3 * 0.10;
      col += uRim * fres * 0.50;
      col += uTint * pow(1.0-ndv, 9.0) * 0.30;
      col = mix(col, col * vec3(0.55,0.62,0.86), uNight * 0.55);

      float a = 0.085 + 0.58 * fres + 0.30 * s1;
      gl_FragColor = vec4(col, clamp(a, 0.0, 1.0));
      #include <colorspace_fragment>
    }`,
  transparent: true, depthWrite: false, side: THREE.FrontSide
});

    uSunCol: { value: new THREE.Color(0xfff0c0) }, uNight: { value: 0 }, uTime: { value: 0 },
    uFlash: { value: 0 }, uStorm: { value: 0 }, uHorizonY: { value: WATER_Y }
  },
  vertexShader: `varying vec3 vW; varying vec3 vN;
    void main(){ vW=(modelMatrix*vec4(position,1.0)).xyz; vN=normalize(mat3(modelMatrix)*normal);
      gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.0); }`,
  fragmentShader: /* glsl */`
    uniform vec3 uZenith,uHorizon,uGround,uSunDir,uSunCol; uniform float uNight,uTime,uFlash,uStorm,uHorizonY;
    varying vec3 vW; varying vec3 vN;
    float h21(vec2 p){ return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5453); }
    void main(){
      vec3 dir = normalize(vW);
      float h = vW.y;
      float t = clamp((h - uHorizonY) / 5.2, 0.0, 1.0);
      vec3 col = mix(uHorizon, uZenith, pow(t, 1.45));
      col = mix(uGround, col, smoothstep(uHorizonY-0.5, uHorizonY+0.25, h));
      // 地平线暖带（沿太阳方位）
      float az = max(dot(normalize(vec3(dir.x, 0.0, dir.z) + 1e-5), normalize(vec3(uSunDir.x, 0.0, uSunDir.z) + 1e-5)), 0.0);
      float band = exp(-pow(max(h - uHorizonY, 0.0) / 1.15, 2.0)) * (0.30 + 0.70 * pow(az, 2.0));
      col = mix(col, uSunCol * 0.85 + vec3(0.22,0.10,0.02), band * 0.50 * (1.0 - uNight * 0.55));
      // 日/月光晕
      float sd = max(dot(dir, normalize(uSunDir)), 0.0);
      col += uSunCol * pow(sd, 7.0) * 0.75 * (1.0 - uNight * 0.72);
      col += uSunCol * pow(sd, 1.8) * 0.22 * (1.0 - uNight * 0.55);
      // 星空
      vec2 sph = vec2(atan(dir.z, dir.x), asin(clamp(dir.y,-1.0,1.0)));
      vec2 g = sph * 78.0, gi = floor(g), gf = fract(g)-0.5;
      float r = h21(gi);
      float star = 0.0;
      if(r > 0.872){
        vec2 o = vec2(h21(gi+1.7), h21(gi+9.3)) - 0.5;
        float d = length(gf - o*0.72);
        float br = 0.35 + 0.65*h21(gi+4.4);
        star = smoothstep(0.08, 0.0, d) * br * (0.72 + 0.28*sin(uTime*2.2 + r*57.0));
      }
      float sm = (1.0 - smoothstep(0.30, 0.78, abs(normalize(vN).x))) * smoothstep(uHorizonY+0.1, uHorizonY+1.8, h);
      col += vec3(0.86,0.92,1.0) * star * sm * uNight * 1.7;
      // 风暴阴云压暗
      col = mix(col, mix(col, vec3(0.10,0.11,0.14), 0.72), uStorm * (0.35 + 0.45*smoothstep(1.0,4.5,h)));
      col += vec3(0.8,0.86,1.0) * uFlash * (0.35 + 0.9*smoothstep(-1.0, 4.0, h));
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`,

});

/* 取景：按视口比例算出"能装下整只瓶子"的距离

   瓶长 25.6，留 7.5% 余量 → d ≥ 27.5 / (0.728·aspect)
   竖屏 aspect 越小所需越远（0.46 → 81.8），这是"横瓶塞进窄屏"的硬几何代价：
   装下整瓶后它只能占屏高 1/6。⚠️ 曾试过把相机绕视轴滚 90° 让瓶子"立起来"，
   但那样瓶内的水面在屏幕上会变成一堵竖墙，破坏"水面恒平"这个核心不变量，已废弃。 */
function fitCamera(keepZoom) {
  if (!camReady) return;
  const a = innerWidth / innerHeight;
  // ① 全景：按视口比例算出"能装下整只瓶子"的距离
  //    可见宽 = 2·d·tan(FOV/2)·aspect = 0.728·d·aspect；瓶长 25.6，留 7.5% 余量
  cam.fitWide = clamp(Math.max(27.5 / (0.728 * a), 20 + (innerWidth - 700) * 0.0096), 21, 95);
  const wide = a >= 1.45;                                    // 宽屏保留桌面构图
  cam.wideTx = wide ? 0 : 5.6;                               // 窄屏以瓶身轴向中心取景
  cam.wideTy = wide ? 5.75 : 6.15;
  cam.wideTz = 0;
  cam.elWide = wide ? 0.225 : 0.27;                         // 窄屏多俯一点，让桌面撑满竖向留白
  // ② 内景：焦点给岛屿（瓶内世界局部坐标 0.15, -0.10，海面在 -0.55）
  cam.diaTx = IC.x; cam.diaTy = BOT_Y + 0.35; cam.diaTz = IC.z;
  cam.fitDia = clamp(9.6 / (0.728 * a), 6, 46);              // 约 7 单位宽的微缩场景占 75% 画幅
  cam.elDia = wide ? 0.30 : 0.34;                            // 稍俯，能看进瓶腹

  if (dt <= 0) dt = 1 / 60;

  /* --- 风暴 --- */
  ST.stormT = (spaceDown || stormLatch) ? 1 : 0;
  ST.storm = damp(ST.storm, ST.stormT, spaceDown ? 1.6 : 0.9, dt);
  const S = ST.storm;
  const amp = lerp(WAVE_A, WAVE_AS, S) * (1 + .25 * Math.sin(ST.t * 2.1) * S);
  // 闪电
  if (S > 0.45) {
    ST.nextBolt -= dt * (0.5 + S);
    if (ST.nextBolt <= 0) { ST.nextBolt = 2.4 + Math.random() * 4.5; ST.flash = 1; }
  }
  ST.flash = Math.max(0, ST.flash - dt * 3.4);
  const bolt = ST.flash > 0 ? (ST.flash > 0.82 ? 1 : ST.flash * (Math.random() > .35 ? 1 : .3)) : 0;
  flashEl.style.opacity = (bolt * 0.30 * S).toFixed(3);

  /* --- 昼夜 --- */
  const dday = ST.day + (ST.speed ? dt * ST.speed / 72 : 0);
  ST.day = dday % 1;
  const th = (ST.day - 0.25) * TAU;
  const elev = Math.sin(th);
  const sunDir = new THREE.Vector3(Math.cos(th) * .92, Math.sin(th), -0.34).normalize();
  const moonDir = sunDir.clone().negate();
  const dayF = smooth(-0.14, 0.30, elev);
  const nightF = 1 - smooth(-0.20, 0.04, elev);
  const duskF = Math.max(0, 1 - Math.abs(elev) / 0.34);

  skyMat.uniforms.uZenith.value.copy(C.zenithNight).lerp(C.zenithDay, dayF).lerp(C.zenithDusk, duskF * .55);
  skyMat.uniforms.uHorizon.value.copy(C.horizNight).lerp(C.horizDay, dayF).lerp(C.horizDusk, duskF * .85);
  skyMat.uniforms.uGround.value.copy(C.groundNight).lerp(C.groundDay, dayF);
  skyMat.uniforms.uSunDir.value.copy(sunDir);
  skyMat.uniforms.uSunCol.value.copy(C.sunLo).lerp(C.sunHi, smooth(0, .55, elev));
  skyMat.uniforms.uNight.value = nightF;
  skyMat.uniforms.uTime.value = ST.t;
  skyMat.uniforms.uFlash.value = bolt;
  skyMat.uniforms.uStorm.value = S;
  skyMat.uniforms.uZenith.value.lerp(C.storm, S * .5);

  // 太阳月亮位置
  const sd = sunDir.clone().multiplyScalar(3.85);
  sunM.position.copy(sd); sunGlow.position.copy(sd);
  const moonPos = moonDir.clone().multiplyScalar(3.85);
  moonM.position.copy(moonPos); moonGlow.position.copy(moonPos);
  const sunVis = clamp(elev * 4 + .2, 0, 1), moonVis = clamp(-elev * 4 + .2, 0, 1);
  sunM.visible = sunGlow.visible = sunVis > .02;
  sunGlow.material.uniforms.k.value = sunVis * (1 - S * .8) * (1 - nightF * .3);
  moonM.visible = moonGlow.visible = moonVis > .02;
  moonGlow.material.uniforms.k.value = moonVis * (.55 + .45 * nightF);
  // 主光：白天为太阳，夜间转为月光（始终有可读照度）
  if (elev > 0) {
    sunLight.position.copy(sunDir).multiplyScalar(40);
    sunLight.color.copy(C.sunLo).lerp(C.sunHi, smooth(0, .5, elev));
    sunLight.intensity = (0.15 + 1.55 * dayF) * (1 - S * .72);
  } else {
    sunLight.position.copy(moonDir).multiplyScalar(40);
    sunLight.color.setHex(0x9db6e8);
    sunLight.intensity = (0.18 + 0.74 * nightF) * (1 - S * .5);
  }
  ambLight.color.copy(C.ambNight).lerp(C.ambDay, dayF);
  ambLight.intensity = (0.30 + 0.26 * dayF) * (1 - S * .35);

  // 体素染色（昼夜）
  matVox.color.copy(C.voxNight).lerp(C.voxDay, dayF);
  matVox2.color.copy(C.voxNight).lerp(C.voxDay, dayF).multiplyScalar(1.06);
  matGull.color.setRGB(lerp(.42, .96, dayF), lerp(.47, .95, dayF), lerp(.62, .92, dayF));
  matCloud.color.copy(C.cloudNight).lerp(C.cloudDay, dayF).lerp(C.cloudDusk, duskF * .42);
  matCloud.color.lerp(C.storm, S * .82);
  matCloud.color.multiplyScalar(1 - S * .25 + bolt * .8);
  matEmis.emissiveIntensity = 0.15 + 2.3 * nightF + .5 * S;
  matGold.emissiveIntensity = .18 + 1.0 * nightF;
  const wgl = world.userData;
  wgl.lamp.intensity = (0.25 + 3.4 * nightF + 1.2 * S) * 1.5;
  wgl.cabinLight.intensity = (0.2 + 2.4 * nightF) * 1.4;
  wgl.chestLight.intensity = 1.0 + 2.6 * nightF;
  wgl.beam.material.uniforms.k.value = clamp(nightF * 1.15 + S * .5, 0, 1.3);
  wgl.beam.rotation.y = ST.t * 1.5;
  wgl.tag = bottleGrp.userData.tag;
  if (wgl.tag) wgl.tag.rotation.z = Math.sin(ST.t * 1.1) * .07;

  /* --- 水体 --- */
  waterMat.uniforms.uTime.value = ST.t;
  waterMat.uniforms.uAmp.value = amp;
  waterMat.uniforms.uSunDir.value.copy(sunDir);
  waterMat.uniforms.uSunCol.value.copy(C.sunLo).lerp(C.sunHi, smooth(0, .5, elev));
  waterMat.uniforms.uAmb.value.copy(C.ambNight).lerp(C.ambDay, dayF).multiplyScalar(.62 + .40 * dayF);
  waterMat.uniforms.uSky.value.copy(C.horizNight).lerp(C.horizDay, dayF).lerp(C.horizDusk, duskF * .6);
  waterMat.uniforms.uNight.value = nightF;
  waterMat.uniforms.uStorm.value = S;
  waterMat.uniforms.uFlash.value = bolt;
  waterMat.uniforms.uDeep.value.copy(C.deepNight).lerp(C.deepDay, dayF);
  waterMat.uniforms.uShallow.value.copy(C.shalNight).lerp(C.shalDay, dayF);
  glassMat.uniforms.uNight.value = nightF;

  /* --- 瓶体在托架上摇晃（瓶内水面保持水平：world 不挂在 bottleGrp 下） --- */
  if (S > 0.02) {
    const r1 = Math.sin(ST.t * 3.1) * .034 * S, r2 = Math.sin(ST.t * 2.3 + 1.2) * .022 * S;
    bottleGrp.rotation.z = damp(bottleGrp.rotation.z, r1, 6, dt);
    bottleGrp.rotation.y = damp(bottleGrp.rotation.y, r2, 6, dt);
    bottleGrp.position.y = BOT_Y + Math.sin(ST.t * 4.4) * .05 * S;
    world.position.y = BOT_Y;
  } else { bottleGrp.rotation.z = damp(bottleGrp.rotation.z, 0, 4, dt); bottleGrp.rotation.y = damp(bottleGrp.rotation.y, 0, 4, dt); bottleGrp.position.y = damp(bottleGrp.position.y, BOT_Y, 4, dt); world.position.y = bottleGrp.position.y; }

  /* --- 帆船：绕岛 + 四点浪高浮力 --- */
  {
    const orbit = ST.t * 0.30;
    const R = 2.88;
    const px = IC.x + Math.cos(orbit) * R, pz = IC.z + Math.sin(orbit) * R;
    const hL = waveH(px - .55, pz, ST.t, amp) + WATER_Y;
    const hR = waveH(px + .55, pz, ST.t, amp) + WATER_Y;
    const hF = waveH(px, pz + .95, ST.t, amp) + WATER_Y;
    const hB = waveH(px, pz - .95, ST.t, amp) + WATER_Y;
    const heave = (hL + hR + hF + hB) * .25;
    const pitch = Math.atan2((hF - hB) * .55, 1.9) * .85;
    const roll = Math.atan2((hL - hR) * .55, 1.1) * .9 + .06;
    const k = ST.shipK = ST.shipK || { y: 0, p: 0, r: 0, vy: 0, vp: 0, vr: 0 };
    k.vy += (heave - k.y) * 26 * dt - k.vy * 5.4 * dt; k.y += k.vy * dt;
    k.vp += (pitch - k.p) * 22 * dt - k.vp * 5.0 * dt; k.p += k.vp * dt;
    k.vr += (roll - k.r) * 20 * dt - k.vr * 4.6 * dt; k.r += k.vr * dt;
    ship.position.set(px, k.y, pz);
    ship.rotation.y = -orbit + Math.PI / 2;
    shipTilt.rotation.x = k.p; shipTilt.rotation.z = -k.r;
    // 艏浪飞沫
    const bowLift = k.vp * .6 + k.vy * .5;
    if (bowLift > 0.02 && Math.random() < bowLift * 26) {
      const fx = px + Math.cos(orbit) * 1.15, fz = pz + Math.sin(orbit) * 1.15;
      spawn('spray', fx, k.y + .2, fz,
        (Math.random() - .5) * .8 + Math.cos(orbit) * .5, 1.1 + Math.random() * 1.4, (Math.random() - .5) * .8 + Math.sin(orbit) * .5,
        .055 + Math.random() * .07, .5 + Math.random() * .5, COL_SPRAY);
    }
    // 尾迹
    if (Math.random() < .8) {
      const tx = px - Math.cos(orbit) * 1.2, tz = pz - Math.sin(orbit) * 1.2;
      for (const sgn of [-1, 1]) spawn('wake',
        tx + Math.cos(orbit + Math.PI / 2) * sgn * .35, k.y - .02, tz + Math.sin(orbit + Math.PI / 2) * sgn * .35,
        -Math.cos(orbit) * .3 + (Math.random() - .5) * .2, .12 + Math.random() * .18, -Math.sin(orbit) * .3 + (Math.random() - .5) * .2,
        .07 + Math.random() * .08, .9 + Math.random() * .9, COL_WAKE);
    }
  }

  /* --- 游动生物 --- */
  {
    // 鱼群
    for (let i = 0; i < fish.n; i++) {
      const o = fish.data[i], a = o.a + ST.t * o.sp;
      const x = IC.x + Math.cos(a) * o.r + Math.sin(ST.t * 1.6 + o.ph) * .28;
      const z = IC.z + Math.sin(a) * o.r * .82 + Math.cos(ST.t * 1.3 + o.ph) * .22;
      const y = o.y + Math.sin(ST.t * 1.1 + o.ph) * .22 + Math.max(0, waveH(x, z, ST.t, amp)) * .8;
      const hd = a + Math.PI / 2;
      for (let k = 0; k < 4; k++) {
        const off = [[0, 0, 0], [0, 0, .07], [0, .05, -.02], [Math.sin(ST.t * 9 + o.ph) * .05, .02, -.12]][k];
        dummy.position.set(x + Math.sin(hd) * off[2], y + off[1], z + Math.cos(hd) * off[2]);
        dummy.rotation.set(0, hd, 0);
        dummy.scale.set(.055, .05, k === 3 ? .05 : .08);
        dummy.updateMatrix(); fish.mesh.setMatrixAt(i * 4 + k, dummy.matrix);
        fish.mesh.setColorAt(i * 4 + k, col(k === 0 ? 0x9fc4d8 : (k === 1 ? 0xe8b45c : 0x6f92a8)));
      }
    }
    fish.mesh.instanceMatrix.needsUpdate = true; if (fish.mesh.instanceColor) fish.mesh.instanceColor.needsUpdate = true;
    // 鲸鱼
    {
      const cyc = 30, p = (ST.t % cyc) / cyc;
      let x, y, z, pitch = 0;
      if (p < 0.60) {                                    // 水下巡游
        const a = p / 0.60 * TAU;
        x = IC.x + Math.cos(a) * 2.2; z = IC.z + Math.sin(a) * 1.5;
        y = WATER_Y - .55 + Math.sin(a * 2) * .35;
        pitch = Math.sin(a * 2) * .12;
      } else {                                           // 跃身出水
        const q = (p - 0.60) / 0.40;
        x = IC.x + (q - .5) * 3.4; z = IC.z + 1.55;
        y = WATER_Y + Math.pow(Math.sin(Math.PI * clamp(q, 0, 1)), .8) * 1.62;
        pitch = (q < .5 ? 1 : -1) * .85 * (1 - Math.abs(q - .5) * 2) + .2;
        if (Math.abs(q - .5) > .47) y = WATER_Y - .3;
        if (q < .06 || q > .94) { if (Math.random() < .5) for (let i = 0; i < 8; i++)
          spawn('spray', x + sr(-.5, .5), WATER_Y + .1, z + sr(-.5, .5), sr(-1, 1), sr(.6, 2), sr(-1, 1), .07, .9, COL_SPRAY); }
      }
      for (let i = 0; i < whale.n; i++) {
        const s = whale.base[i];
        const bend = Math.sin(ST.t * 2.4 - s.z * 1.5) * .12;
        dummy.position.set(x + s.x + bend * s.z * .2, y + s.y, z + s.z);
        dummy.rotation.set(pitch + bend, 0, 0);
        dummy.scale.set(s.sx, s.sy, s.sz); dummy.updateMatrix();
        whale.mesh.setMatrixAt(i, dummy.matrix);
        whale.mesh.setColorAt(i, col(s.c));
      }
      whale.mesh.instanceMatrix.needsUpdate = true; if (whale.mesh.instanceColor) whale.mesh.instanceColor.needsUpdate = true;
    }
    // 螃蟹
    {
      let k = 0;
      crab.d.forEach((o, n) => {
        const a = o.a + Math.sin(ST.t * .8 + o.t) * 1.1;
        const cx = o.x + Math.cos(a) * .28, cz = o.z + Math.sin(a) * .28;
        const cy = WATER_Y + islH(cx, cz) + .12;
        for (let j = 0; j < 6; j++) {
          const s = crab.mesh.geometry === boxGeo ? [[0, 0, 0, .13], [j < 1 ? -.1 : .1, .02, .05, .075],
            [j < 1 ? -.13 : .13, .04, .13, .065], [j < 1 ? -.09 : .09, -.02, -.1, .05]][j % 4] : null;
          dummy.position.set(cx + s[0], cy + s[1], cz + s[2]);
          dummy.rotation.set(0, -a + 1.2, 0);
          dummy.scale.setScalar(s[3]); dummy.updateMatrix();
          crab.mesh.setMatrixAt(k, dummy.matrix);
          crab.mesh.setColorAt(k, col(s === undefined ? 0 : (j === 0 ? 0xd4462e : (j % 2 ? 0xc03a24 : 0xe05a3a))));
          k++;
        }
      });
      crab.mesh.instanceMatrix.needsUpdate = true; if (crab.mesh.instanceColor) crab.mesh.instanceColor.needsUpdate = true;
    }
    // 浮标
    {
      const bx = buoy.position.x, bz = buoy.position.z;
      const h = waveH(bx, bz, ST.t, amp) + WATER_Y;
      const hx = waveH(bx + .3, bz, ST.t, amp) + WATER_Y, hz = waveH(bx, bz + .3, ST.t, amp) + WATER_Y;
      buoy.position.y = damp(buoy.position.y, h, 12, dt);
      buoy.rotation.z = damp(buoy.rotation.z, (h - hx) * 1.6, 10, dt);
      buoy.rotation.x = damp(buoy.rotation.x, (h - hz) * 1.6, 10, dt);
    }
    // 海鸥
    {
      let k = 0;
      gulls.d.forEach((o, i) => {
        const a = o.a + ST.t * o.sp;
        const x = IC.x + Math.cos(a) * o.r, z = IC.z + Math.sin(a) * o.r;
        const y = o.y + Math.sin(ST.t * o.sp * 1.6 + o.ph) * .28;
        const hd = a + Math.PI / 2, flap = Math.sin(ST.t * o.fl + o.ph) * .8;
        const put = (dx, dy, dz, sx, sy, sz, rx) => {
          dummy.position.set(x + Math.cos(hd) * dx + Math.sin(hd) * dz, y + dy, z - Math.sin(hd) * dx + Math.cos(hd) * dz);
          dummy.rotation.set(rx || 0, hd, o.dr);
          dummy.scale.set(sx, sy, sz); dummy.updateMatrix();
          gulls.mesh.setMatrixAt(k, dummy.matrix);
          gulls.mesh.setColorAt(k, col(dz > .12 ? 0xe8a63c : (Math.abs(dx) > .06 ? 0xd8d2c4 : 0xf6f3ea))); k++;
        };
        put(0, 0, 0, .105, .105, .105, .1);
        put(0, .025, .11, .085, .085, .085, 0);
        put(0, .012, .21, .06, .055, .06, 0);
        put(-.13, .025, -.02, .19, .04, .06, -flap * .5);
        put(.13, .025, -.02, .19, .04, .06, flap * .5);
        put(0, 0, -.15, .05, .04, .11, 0);
      });
      gulls.mesh.instanceMatrix.needsUpdate = true; if (gulls.mesh.instanceColor) gulls.mesh.instanceColor.needsUpdate = true;
    }
    // 云
    for (const c of clouds) {
      c.position.x += Math.cos(c.userData.ph + ST.t * c.userData.sp) * .0035;
      c.position.z += Math.sin(c.userData.ph + ST.t * c.userData.sp) * .0035;
    }
  }

  /* --- 粒子 --- */
  {
    // 持续气泡（生成点限制在瓶腔内）
    if (Math.random() < .55 + S * .6) spawn('bub', sr(-2.6, 2.6), seabed + .4, sr(-2.0, 2.0), sr(-.06, .06), sr(.45, .8), sr(-.06, .06), .05, 4.5, COL_BUB);
    if (S > .5 && Math.random() < 3.4 * S) spawn('rain', sr(-2.8, 2.8), sr(2.1, 3.2), sr(-2.2, 2.2), sr(-.25, .25), -3.6 - S * 1.4, sr(-.25, .25), .035, 1.6, COL_RAIN);
    if (Math.random() < .28) { const ch = world.userData.chimney; spawn('smoke', ch.x + sr(-.06, .06), ch.y, ch.z + sr(-.06, .06), sr(.05, .3), sr(.35, .6), sr(-.2, .2), .12, 2.4, COL_SMOKE); }
    let k = 0;
    for (const p of P.list) {
      if (p.life > 0) {
        p.life -= dt;
        // 瓶腔封闭性保险：任何粒子一旦越出内壁立即回收
        if (Math.hypot(p.x, p.z) > innerR(p.x) - 0.14 || p.y > 4.35 || p.y < -4.5) { p.life = 0; continue; }
        if (p.t === 'rain') { p.vy += 1.5 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; }
        else if (p.t === 'bub') { p.x += (p.vx + Math.sin(ST.t * 2.4 + p.seed) * .16) * dt; p.y += p.vy * dt; p.z += (p.vz + Math.cos(ST.t * 2.1 + p.seed) * .16) * dt; }
        else if (p.t === 'smoke') { p.vy += .12 * dt; p.x += (p.vx + Math.sin(ST.t + p.seed) * .12) * dt; p.y += p.vy * dt; p.z += (p.vz + Math.cos(ST.t + p.seed) * .1) * dt; }
        else { p.vy -= 4.2 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vx *= .985; p.vz *= .985; }
        if (p.t !== 'rain' && p.t !== 'bub') {                          // 出水粒子浮于浪面
          const w = waveH(p.x, p.z, ST.t, amp) + WATER_Y;
          if (p.y < w && p.vy < 0) { p.y = w; p.vy *= -.28; p.vx *= .7; p.vz *= .7; }
        }
        const r = p.life / p.max;
        const s = p.t === 'smoke' ? p.s * (1 + (1 - r) * 2.4) : p.t === 'bub' ? p.s * (.6 + .5 * Math.sin(ST.t * 3 + p.seed)) : p.s * (p.t === 'rain' ? 1 : clamp(r * 1.6, 0, 1));
        dummy.position.set(p.x, p.y, p.z);
        dummy.rotation.set(0, p.seed, 0);
        dummy.scale.set(p.t === 'rain' ? s * .5 : s, p.t === 'rain' ? s * 5 : s, p.t === 'rain' ? s * .5 : s);
        dummy.updateMatrix(); P.mesh.setMatrixAt(k, dummy.matrix);
        P.mesh.setColorAt(k, col(p.c || COL_SPRAY)); k++;
      }
    }
    P.mesh.count = k;
    P.mesh.instanceMatrix.needsUpdate = true; if (P.mesh.instanceColor) P.mesh.instanceColor.needsUpdate = true;
  }

  /* --- 相机 --- */
  {
    if (camKeys.ArrowLeft) cam.az += 1.1 * dt;
    if (camKeys.ArrowRight) cam.az -= 1.1 * dt;
    if (camKeys.ArrowUp) cam.el = clamp(cam.el + 0.75 * dt, -0.34, 0.86);
    if (camKeys.ArrowDown) cam.el = clamp(cam.el - 0.75 * dt, -0.34, 0.86);
    if (camKeys.Equal || camKeys.NumpadAdd) setZoom(cam.zoom - 0.9 * dt);
    if (camKeys.Minus || camKeys.NumpadSubtract) setZoom(cam.zoom + 0.9 * dt);
    cam.idle += dt;
    // 视图模式过渡：注视点由「瓶身中点」滑向「岛屿」，距离随之推拉
    if (Math.abs(cam.focus - cam.focusT) > 0.0005) {
      cam.focus = damp(cam.focus, cam.focusT, 2.6, dt);
      applyFraming(false);
      cam.el = damp(cam.el, cam.elDefault, 2.6, dt);
    }
    const want = (cam.drag || Object.values(camKeys).some(Boolean)) ? 0 : (cam.idle > 2.2 ? 1 : 0);
    cam.auto = damp(cam.auto, want * .17, want ? .5 : 3.2, dt);
    if (Number.isFinite(cam.az)) cam.az += cam.auto * dt; else cam.az = 0;
    camera.up.set(0, 1, 0);
    const ce = Math.cos(cam.el), se = Math.sin(cam.el);
    camera.position.set(cam.tx + Math.sin(cam.az) * ce * cam.dist, cam.ty + se * cam.dist, cam.tz + Math.cos(cam.az) * ce * cam.dist);
    camera.lookAt(cam.tx, cam.ty, cam.tz);
  }

  /* --- HUD --- */
  {
    const hrs = ST.day * 24;
    let nm = '子夜'; for (const [n, h] of PHASE) if (hrs >= h) nm = n;
    phaseEl.textContent = nm;
    clockEl.textContent = `${String(Math.floor(hrs)).padStart(2, '0')}:${String(Math.floor(hrs % 1 * 60)).padStart(2, '0')}  /  ${ST.speed ? '×' + ST.speed : '暂停'}`;
    stormFill.style.width = (S * 100).toFixed(0) + '%';
    stormBtn.classList.toggle('on', S > 0.5);
    fpsEl.textContent = window.__fps ? window.__fps + ' FPS' : '— FPS';
  }

  /* --- 渲染：先无玻璃的场景缓冲（供折射） --- */
  glass.visible = false;
  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  glass.visible = true;
  renderer.render(scene, camera);

  frames++; fpsT += dt;
  if (fpsT > 2) { window.__fps = (frames / fpsT).toFixed(1); frames = 0; fpsT = 0; }
}
animate();
window.__ready = true;
</script>
</body>
</html>
